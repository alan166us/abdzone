<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with subtle border -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="96" fill="none" stroke="#334155" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Supply Zone (Top Layer) -->
  <rect x="76" y="96" width="360" height="52" rx="12" fill="#E11D48" fill-opacity="0.18" stroke="#FB7185" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="96" y="128" fill="#FDA4AF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="2">SUPPLY ZONE</text>

  <!-- Chart Grid lines -->
  <line x1="76" y1="210" x2="436" y2="210" stroke="#1E293B" stroke-width="2"/>
  <line x1="76" y1="290" x2="436" y2="290" stroke="#1E293B" stroke-width="2"/>

  <!-- Candlesticks Center Flow -->
  <!-- Candle 1 (Down) -->
  <line x1="130" y1="130" x2="130" y2="240" stroke="#F43F5E" stroke-width="4" stroke-linecap="round"/>
  <rect x="114" y="150" width="32" height="70" rx="4" fill="url(#roseGrad)"/>

  <!-- Candle 2 (Base Compaction) -->
  <line x1="190" y1="230" x2="190" y2="310" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  <rect x="178" y="250" width="24" height="40" rx="3" fill="#334155"/>

  <!-- Candle 3 (Strong Bull Departure) -->
  <line x1="256" y1="180" x2="256" y2="350" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
  <rect x="238" y="200" width="36" height="130" rx="6" fill="url(#emeraldGrad)" filter="url(#glow)"/>

  <!-- Candle 4 (Continuation) -->
  <line x1="322" y1="150" x2="322" y2="270" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
  <rect x="306" y="165" width="32" height="85" rx="5" fill="url(#emeraldGrad)"/>

  <!-- Candle 5 (Test Upper Boundary) -->
  <line x1="384" y1="110" x2="384" y2="210" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <rect x="368" y="125" width="32" height="65" rx="5" fill="url(#cyanGrad)"/>

  <!-- Demand Zone (Bottom Layer) -->
  <rect x="76" y="364" width="360" height="52" rx="12" fill="#059669" fill-opacity="0.18" stroke="#34D399" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="96" y="396" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="2">DEMAND ZONE</text>

  <!-- Strata S Brand Chevron Badge in Center -->
  <path d="M 230 450 L 256 428 L 282 450" fill="none" stroke="#34D399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
